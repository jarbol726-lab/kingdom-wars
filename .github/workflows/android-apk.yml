name: Build Kingdom Wars APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'kingdom-wars-android-ready.zip'
      - '.github/workflows/android-apk.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Extract project
        run: |
          unzip kingdom-wars-android-ready.zip -d extracted
          cd extracted/kingdom-wars
          echo "PROJECT_DIR=$GITHUB_WORKSPACE/extracted/kingdom-wars" >> $GITHUB_ENV

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install dependencies
        working-directory: extracted/kingdom-wars
        run: |
          npm ci
          npm install --no-save --package-lock=false @capacitor/core @capacitor/android @capacitor/cli

      - name: Build Android project
        working-directory: extracted/kingdom-wars
        run: |
          npx cap add android
          npx cap sync android
          cd android
          ./gradlew assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: kingdom-wars-apk
          path: extracted/kingdom-wars/android/app/build/outputs/apk/debug/app-debug.apk
